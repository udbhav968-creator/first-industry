version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: techstack_searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=techstack-issues-finder-searxng
      - SEARXNG_SECRET=techstack_searxng_secret_key_change_in_production
    restart: unless-stopped

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: techstack_crawl4ai
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=""
    restart: unless-stopped
